name: Keep Render instance warm

# Render's free tier spins the web service down after ~15 minutes of inactivity,
# and the next visitor then waits ~20s for a cold boot (measured). Pinging the
# app on a schedule keeps it awake during working hours.
#
# Budget note: GitHub gives private repos 2,000 Actions minutes/month, and every
# run is billed as a full minute regardless of actual duration. Pinging around
# the clock (~4,300 runs/month) would blow past that, so this only runs during
# Saudi working hours, Sunday–Thursday: ~1,100 runs/month, comfortably inside
# the free allowance. Outside those hours the first visitor still pays the cold
# start — that is the deliberate trade for staying on the free tier.

on:
  schedule:
    # Every 14 minutes, 04:00–15:59 UTC == 07:00–18:59 Asia/Riyadh (UTC+3),
    # Sunday–Thursday. 14 minutes stays under Render's ~15 minute idle timeout.
    - cron: "*/14 4-15 * * 0-4"
  # Lets you trigger a wake-up by hand from the Actions tab.
  workflow_dispatch:

# If a previous ping is somehow still running, don't stack another on top.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app
        run: |
          URL="https://erp-system-hm8t.onrender.com/login"

          # A cold Render instance can take ~30s to answer, so allow a generous
          # timeout and retry rather than failing the run on the first attempt.
          code=$(curl -sS -o /dev/null \
                      --max-time 90 \
                      --retry 3 --retry-delay 15 --retry-all-errors \
                      -w "%{http_code}" \
                      "$URL")

          echo "HTTP $code from $URL"

          # 2xx/3xx both mean the server is awake and serving.
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::error::Unexpected status $code — app may be down."
            exit 1
          fi
